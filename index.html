<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmallTalk – B2/C1 Speaking &amp; Writing Practice</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">

    <header class="top">
      <!-- Avatar placeholder: replace the <svg> with <img src="tutor.png" alt="Tutor"> (64x64 or 128x128 pixel art) -->
<div class="avatar" aria-hidden="true">
        <img id="avatar-img" src="img/tutor1.png" alt="Tutor">
      </div>
      <div>
        <h1>SmallTalk</h1>
        <p class="tagline">Answer it. Ask it. Level up your English.</p>
      </div>
    </header>

    <!-- Setup -->
    <section id="setup-screen" aria-labelledby="setup-title">
      <h2 id="setup-title">Choose your game</h2>
            <fieldset class="group">
        <legend class="group__label">Mode</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="mode" value="text" checked><span>Text Practice</span></label>
          <label class="choice"><input type="radio" name="mode" value="speaking"><span>Speaking Simulator</span></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend class="group__label">Level</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="level" value="b2" checked><span>B2 (Upper Intermediate)</span></label>
          <label class="choice"><input type="radio" name="level" value="c1"><span>C1 (Advanced)</span></label>
        </div>
      </fieldset>

      <fieldset class="group" id="length-group">
        <legend class="group__label">Session length</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="rounds" value="10" checked><span>10 Rounds</span></label>
          <label class="choice"><input type="radio" name="rounds" value="20"><span>20 Rounds</span></label>
        </div>
      </fieldset>

      <button type="button" class="btn" id="start-btn">Start game</button>
      <p class="hint" id="setup-error" role="alert" hidden></p>
    </section>

    <!-- Practice -->
    <section id="practice-screen" aria-label="Practice round" hidden>
      <div class="row"><span class="tracker" id="round-tracker"></span></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress__fill" id="progress-fill"></span>
      </div>

      <span class="badge" id="type-badge"></span>
      <div class="prompt" id="prompt-box" aria-live="polite"></div>

      <label for="answer-input" class="field-label" id="input-label">Your response</label>
      <textarea id="answer-input" placeholder="Type here..."></textarea>
      <p class="hint" id="input-hint"></p>

      <div class="row">
        <button type="button" class="btn btn--green" id="quit-btn">Quit</button>
        <button type="button" class="btn" id="next-btn" disabled>Next</button>
      </div>
    </section>

    <!-- Completion -->

        <!-- Speaking simulator -->
    <section id="speaking-screen" aria-label="Speaking simulator" hidden>
      <div class="row"><span class="tracker" id="sp-tracker"></span></div>
      <div class="progress" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="sp-progress">
        <span class="progress__fill" id="sp-fill"></span>
      </div>
      <span class="badge" id="sp-badge"></span>
      <div class="prompt" id="sp-prompt" aria-live="polite"></div>
      <div class="frame" id="sp-frame" hidden></div>

      <div class="timer-row">
        <div class="timer" role="timer" aria-label="Time remaining"><span class="timer__fill" id="sp-timer"></span></div>
        <span class="tracker" id="sp-time">0:30</span>
      </div>
      <div class="mic-row">
        <button type="button" class="mic" id="sp-mic" aria-pressed="false">● REC</button>
        <p class="hint" id="sp-status"></p>
      </div>

      <label for="sp-transcript" class="field-label">Transcript (you can edit it)</label>
      <textarea id="sp-transcript" placeholder="Your transcript appears here..."></textarea>

      <div class="row">
        <button type="button" class="btn btn--green" id="sp-quit">Quit</button>
        <button type="button" class="btn" id="sp-next" disabled>Next</button>
      </div>
    </section>

    <section id="done-screen" aria-labelledby="done-title" hidden>
      <h2 id="done-title">Stage clear!</h2>
      <p>Great work. Download your answers and bring them to your next lesson.</p>
      <div class="stats">
        <div class="stat"><b id="stat-level"></b>Level</div>
        <div class="stat"><b id="stat-rounds"></b>Rounds</div>
        <div class="stat"><b id="stat-words"></b>Words</div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="export-btn">Download .md</button>
        <button type="button" class="btn" id="email-btn" hidden>Email tutor</button>
        <button type="button" class="btn btn--green" id="again-btn">Play again</button>
      </div>
    </section>

  </main>
  
    <dialog id="passcode-modal" class="modal" aria-labelledby="pass-title">
    <form id="pass-form">
      <h2 id="pass-title">Enter passcode</h2>
      <p class="hint">Ask your tutor for the speaking passcode.</p>
      <input type="password" id="pass-input" autocomplete="off" aria-label="Passcode" required>
      <div class="row">
        <button type="button" class="btn btn--green" id="pass-cancel">Cancel</button>
        <button type="submit" class="btn">Unlock</button>
      </div>
    </form>
  </dialog>
  <!-- Order matters: data first, then logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
